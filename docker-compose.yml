version: '3.9'

services:
  api-gateway:
    image: apigateaway
    build:
      context: .
      dockerfile: APIGateaway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - user-service
      - order-service
      - product-service

  user-service:
    image: userservice
    build:
      context: .
      dockerfile: UserService/Dockerfile

  order-service:
    image: orderservice
    build:
      context: .
      dockerfile: OrderService/Dockerfile

  product-service:
    image: productservice
    build:
      context: .
      dockerfile: ProductService/Dockerfile

  redis:
    image: redis:7
    ports:
      - "6379:6379"
  
  prometheus:
    image: prom/prometheus
    volumes:
      - ./APIGateaway/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"